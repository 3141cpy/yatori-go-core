<script>
    var checkresult;
    var signCode="";
    function renderGesturePasswd(){
        let vminLength = Math.min(document.documentElement.clientWidth, document.documentElement.clientHeight);
        $("#gesturepwd-container .gesturepwd").remove();
        $('#gesturepwd-container').prepend('<div id="gesturepwd" class="gesturepwd"></div>');
        $("#gesturepwd").GesturePasswd({
            backgroundColor: "none", //背景色
            color: "#999", //主要的控件颜色
            lineWidth: 2,
            roundRadii: 27*vminLength/375, //大圆点的半径
            pointRadii: 7*vminLength/375, //大圆点被选中时显示的圆心的半径
            space: 34*vminLength/375, //大圆点之间的间隙
            width: vminLength * 7/10, //整个组件的宽度
            height: vminLength * 7/10, //整个组件的高度
            lineColor: "#7fccff", //用户划出线条的颜色
            cirCleColor: "#09f", //用户划出圆的颜色
            zindex: 100, //整个组件的css z-index属性
            isRem: false, // 是否使用rem（默认比例750/100）
            definition: 1,
            triangleSize: 14*vminLength/375,  // 三角的大小
            triangleDistance: 10*vminLength/375,  // 三角的距离
        });

        $(".gesturepwd").on("hasPasswd", function(e, passwd) {
            if(passwd.length <= 3){
                $("#gesturepwd").trigger("passwdWrong");
                return;
            }
            signCode = passwd;
            var activeId="5000173244801";
            var url = "/widget/sign/pcStuSignController/checkSignCode";
            $.ajax(url,{
                data:{"activeId":activeId,"signCode":passwd},
                dataType:"json",
                success:function(obj) {
                    if (obj.result == 1) {
                        checkresult=true;
                    }else{
                        checkresult=false;
                    }
                    if(checkresult == true){
                        $("#gesturepwd").trigger("passwdRight");
                        setTimeout(function(){
                            navOpen();
                        },200);  //延迟半秒以照顾视觉效果
                    } else{
                        //密码验证错误后的其他操作。。。
                        $(document.body).append("<article id='ts' class='zal_bg'  style='bottom:50%'><span id='wz'></span></article>");
                        // -1 表示触发暴力破解封禁，显示后台返回的错误提示
                        if (obj.result == -1 && obj.errorMsg) {
                            $("#wz").html(obj.errorMsg);
                        } else {
                            $("#wz").html("手势错误，请重试");
                        }
                        tep(".zal_bg",1);
                        $("#gesturepwd").trigger("passwdWrong");
                    }
                }
            });
        });
    }
    renderGesturePasswd()

    var resizeTimer = null;
    var window_width = document.documentElement.clientWidth;
    window.addEventListener("resize", (event) => {
        resizeTimer = resizeTimer ? null : setTimeout(() => {
            if(window_width != document.documentElement.clientWidth){
                renderGesturePasswd();
            }
        },0);
    });
</script>
<script >
    window.alert = function(name){
        var iframe = document.createElement("IFRAME");
        iframe.style.display="none";
        iframe.setAttribute("src", 'data:text/plain,');
        document.documentElement.appendChild(iframe);
        window.frames[0].window.alert(name);
        iframe.parentNode.removeChild(iframe);
    };
    window.confirm = function (message) {
        var iframe = document.createElement("IFRAME");
        iframe.style.display = "none";
        iframe.setAttribute("src", 'data:text/plain,');
        document.documentElement.appendChild(iframe);
        var alertFrame = window.frames[0];
        var result = alertFrame.window.confirm(message);
        iframe.parentNode.removeChild(iframe);
        return result;
    };
</script>

    function urlParamsToObject(url) {
        //获取字符串 ? 后面的部分
        var queryString = url.split('?')[1];
        var paramsArr = queryString.split('&');
        var paramObj = {};

        paramsArr.forEach(param => {
            var idx = param.indexOf('=');
            if (idx != -1) {
                var key = param.substring(0, idx);
                var value = param.substring(idx + 1);
                paramObj[key] = decodeURIComponent(value);
            } else {
                paramObj[param] = undefined;
            }
        });

        return paramObj;
    }

    Date.prototype.Format = function (fmt) {
        var o = {
            "M+": this.getMonth() + 1, //月份
            "d+": this.getDate(), //日
            "H+": this.getHours(), //小时
            "m+": this.getMinutes(), //分
            "s+": this.getSeconds(), //秒
            "q+": Math.floor((this.getMonth() + 3) / 3), //季度
            "S": this.getMilliseconds() //毫秒
        };
        if (/(y+)/.test(fmt)) fmt = fmt.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));
        for (var k in o)
            if (new RegExp("(" + k + ")").test(fmt)) fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
        return fmt;
    }
